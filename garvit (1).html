<!DOCTYPE html>
<html>
<head>
    <title>SHIPTRACKER- Delivery Made Simple</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            <span class="logo-icon">📦</span>
            <span>SHIPTRACKER</span>
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Track Shipment</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

        <button class="login-button">Login</button>

    </nav>


    <!-- Main Hero Section -->
    <section class="hero">

        <!-- Left Side -->
        <div class="hero-left">

            <p class="small-heading">
                FAST • SAFE • RELIABLE
            </p>

            <h1>
                Your Package,<br>
                <span>Our</span><br>
                <span>Responsibility.</span>
            </h1>

            <p class="description">
                Send and track your packages easily with SHIPTRACKER.
                We make delivery simple, fast and reliable.
            </p>

            <div class="buttons">

                <button class="track-button">
                    Track Shipment
                </button>

                <button class="services-button">
                    Our Services
                </button>

            </div>

        </div>


        <!-- Right Side - Tracking Box -->
        <div class="tracking-box">

            <div class="truck-icon">
                🚚
            </div>

            <h2>
                Track Your Shipment
            </h2>

            <p>
                Enter your tracking ID to check your package status.
            </p>

            <input
                type="text"
                placeholder="Enter Tracking ID"
            >

            <button class="track-package">
                Track Package
                <span>→</span>
            </button>

        </div>

    </section>


</body>
</html>
