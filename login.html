
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - ShipTracker</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <span>📦</span>
            <h2>SHIPTRACKER</h2>
        </div>

        <button class="menu-btn" id="menuBtn" type="button"
            aria-label="Toggle navigation" aria-expanded="false">☰</button>

        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="track.html">Track</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- LOGIN SECTION -->
    <section class="login-section">

        <div class="login-container">

            <div class="login-left">
                <div class="welcome-content">
                    <span class="big-icon">📦</span>
                    <h1>Welcome Back!</h1>
                    <p>
                        Login to your ShipTracker account and
                        stay updated with your deliveries.
                    </p>
                </div>
            </div>

            <div class="login-right">

                <h2>Customer Login</h2>
                <p class="subtitle">Enter your details to continue</p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email"
                            placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <div class="password-box">
                            <input type="password" id="password"
                                placeholder="Enter your password" required>

                            <button type="button" id="togglePassword">
                                Show
                            </button>
                        </div>
                    </div>

                    <div class="login-options">
                        <label>
                            <input type="checkbox" id="remember">
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="login-btn">
                        Login
                    </button>

                    <p id="loginMessage"></p>

                </form>

                      <div class="register-link">
                        <p>New to ShipTracker?</p>
                        <a href="register.html">Create an Account</a>
                      </div>

            </div>
        </div>


    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 ShipTracker | Delivery Made Simple</p>
    </footer>

    <script src="shiptracker.js"></script>


</body>
</html>
