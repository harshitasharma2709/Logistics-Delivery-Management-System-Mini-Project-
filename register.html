
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Register - ShipTracker</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <span>📦</span>
            <h2>SHIPTRACKER</h2>
        </div>

        <button class="menu-btn" id="menuBtn" type="button"
            aria-label="Toggle navigation" aria-expanded="false">☰</button>

        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="track.html">Track</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- REGISTER SECTION -->
    <section class="register-section">

        <div class="register-container">

            <div class="register-left">
                <div class="welcome-content">
                    <span class="big-icon">📦</span>
                    <h1>Join ShipTracker!</h1>
                    <p>
                        Create your account and enjoy an easier
                        way to manage and track your deliveries.
                    </p>
                </div>
            </div>

            <div class="register-right">

                <h2>Create Account</h2>
                <p class="subtitle">Enter your details to register</p>

                <form id="registerForm">

                    <div class="form-group">
                        <label for="regName">Full Name</label>
                        <input type="text" id="regName"
                            placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Email Address</label>
                        <input type="email" id="regEmail"
                            placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="regPhone">Phone Number</label>
                        <input type="tel" id="regPhone"
                            placeholder="Enter your phone number"
                            maxlength="10" required>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <div class="password-box">
                            <input type="password" id="regPassword"
                                placeholder="Create a password" required>
                            <button type="button" id="toggleRegPassword">
                                Show
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword"
                            placeholder="Confirm your password" required>
                    </div>

                    <button type="submit" class="register-btn">
                        Register
                    </button>

                    <p id="registerMessage"></p>

                </form>

                <div class="login-link">
                    <p>Already have an account?</p>
                    <a href="login.html">Login Here</a>
                </div>

            </div>
        </div>

    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 ShipTracker | Delivery Made Simple</p>
    </footer>

    <script src="shiptracker.js"></script>

</body>
</html>
